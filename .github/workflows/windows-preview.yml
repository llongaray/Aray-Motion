name: Windows preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'requirements-windows.txt'
      - '.github/workflows/windows-preview.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: python -m pip install -r requirements-windows.txt pyinstaller
      - name: Compilar prévia
        run: python -m PyInstaller --noconfirm --windowed --onedir --name ArayMotion --collect-all mediapipe --collect-all cv2 --paths . desktop/app.py
      - name: Compactar prévia
        shell: pwsh
        run: Compress-Archive -Path dist/ArayMotion -DestinationPath ArayMotion-Windows-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ArayMotion-Windows-preview
          path: ArayMotion-Windows-preview.zip
